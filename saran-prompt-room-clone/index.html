<style>
:root{

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}

.search-wrap{position:relative}.search-wrap:before{content:"⌕";position:absolute;left:12px;top:11px;color:#8c7f74;font-size:14px}.search{width:100%;height:40px;padding:0 12px 0 32px;border:1px solid var(--line);border-radius:12px;background:#fffaf4;color:var(--ink);outline:none}.search:focus{border-color:#967765;box-shadow:0 0 0 3px rgba(113,82,63,.10)}
.side-label{margin:24px 0 10px;color:#9a897b;font:700 9px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase}.scene-list{display:grid;gap:7px}.scene-btn{width:100%;border:1px solid transparent;border-radius:14px;background:transparent;padding:11px 12px;text-align:left;color:var(--ink);transition:.16s}.scene-btn:hover{background:#f0e8df}.scene-btn.active{background:var(--paper);border-color:var(--line);box-shadow:0 7px 20px rgba(48,35,28,.055)}
.scene-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.scene-no{font:700 9px var(--mono);letter-spacing:.08em;color:#a46f58}.scene-count{font:700 9px var(--mono);color:#9b9087}.scene-title{margin-top:5px;font-weight:760;font-size:13px;letter-spacing:-.02em}.scene-meta{margin-top:4px;font-size:10px;color:var(--muted)}

.section{margin-top:28px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px}.section-head h2{font-family:var(--serif);font-size:22px;line-height:1.2;margin:0;letter-spacing:-.03em}.section-head p{margin:6px 0 0;color:var(--muted);font-size:11px}.ghost,.icon-btn{border:1px solid var(--line);background:#fffaf4;color:var(--ink);border-radius:10px;font-size:11px}.ghost{padding:9px 11px}.ghost:hover,.icon-btn:hover{background:#fff}.ghost:focus-visible,.icon-btn:focus-visible,.pick:focus-visible,.tab:focus-visible,.scope button:focus-visible,.scene-btn:focus-visible{outline:3px solid rgba(113,82,63,.17);outline-offset:2px}

.thumb{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:var(--scene-bg,linear-gradient(135deg,#c6ab98,#715346 48%,#2b2623));display:grid;place-items:center;color:#fff}.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.34),transparent 56%),radial-gradient(circle at var(--light-x,67%) 24%,rgba(255,237,214,.42),transparent 23%)}.thumb .figure{position:absolute;left:55%;bottom:-2%;width:24%;height:66%;border-radius:42% 42% 13% 13%;background:linear-gradient(180deg,rgba(35,31,30,.87),rgba(22,21,21,.97));filter:drop-shadow(0 7px 9px rgba(0,0,0,.35));transform:translateX(-50%) rotate(var(--tilt,0deg));z-index:1}.thumb .figure:before{content:"";position:absolute;width:46%;aspect-ratio:1;border-radius:50%;background:#c4a38e;left:27%;top:-20%;box-shadow:inset -5px -2px 8px rgba(62,42,32,.18)}.thumb .figure:after{content:"";position:absolute;width:62%;height:20%;border-radius:50% 50% 35% 35%;background:#2b2421;left:18%;top:-23%}.play{position:relative;z-index:3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.72);background:rgba(18,16,15,.22);backdrop-filter:blur(4px);font-size:14px;padding-left:2px}.thumb-label{position:absolute;left:9px;bottom:8px;z-index:3;font:700 9px var(--mono);letter-spacing:.08em;color:#fff}.thumb-duration{position:absolute;right:8px;bottom:7px;z-index:3;font:700 9px var(--mono);background:rgba(18,16,15,.45);padding:3px 5px;border-radius:6px}

.expanded-grid{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:12px}.expanded-grid.show{display:grid}.expanded-grid .attempt{min-width:0;max-width:none}

#fff;border-radius:99px}.viewer.playing .progress>i{animation:progress 2.4s linear forwards}.viewer.playing .viewer-video:after{content:"재생 중";position:absolute;top:9px;right:9px;z-index:4;background:rgba(25,21,19,.54);color:#fff;padding:4px 6px;border-radius:6px;font:700 8px var(--mono);letter-spacing:.08em}@keyframes progress{to{width:100%}}
.compare-nav{display:flex;justify-content:center;gap:7px;margin-top:11px}.icon-btn{padding:8px 10px}.selection-summary{display:flex;justify-content:center;gap:12px;margin-top:8px;color:#8a7b70;font:9px var(--mono)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:21px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;padding:10px 12px;color:#84776d;font-size:11px}.tab.active{color:var(--ink);font-weight:780;border-bottom-color:#6f503d}.panel{padding-top:15px}.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prompt-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper-2)}.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.prompt-head strong{font:700 10px var(--mono);letter-spacing:.08em}.copy{border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 8px;font:10px var(--mono)}.prompt{font:11px/1.7 var(--mono);color:#453d38;word-break:break-word}.del{background:var(--red-soft);color:#713a34;text-decoration:line-through;text-decoration-thickness:1px}.add{background:var(--green-soft);color:#355344}.same{color:#4d4540}.full-prompt{display:none;margin-top:11px;border:1px dashed var(--line-strong);background:#f7efe6;border-radius:12px;padding:13px;white-space:pre-wrap;font:11px/1.65 var(--mono);color:#4a4039}.full-prompt.show{display:block}
.settings{display:none}.settings.active{display:block}.setting-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.setting{margin:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper-2)}.setting dt{color:#8c796b;font:700 9px var(--mono);letter-spacing:.08em}.setting dd{margin:5px 0 0;font-size:11px}.reference{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fffaf4}.reference b{font-size:11px}.reference p{font-size:10px;line-height:1.6;color:var(--muted);margin:6px 0 0}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;color:#7b6e64;font-size:9px}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:11px;height:7px;border-radius:2px}.swatch.del{background:var(--red-soft)}.swatch.add{background:var(--green-soft)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#2a2421;color:#fff;border-radius:10px;padding:9px 12px;font-size:10px;box-shadow:0 8px 20px rgba(0,0,0,.18);transition:.18s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
.mobilebar,.mobile-scenes{display:none}
@media(max-width:1020px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobilebar{display:flex;position:sticky;top:0;z-index:20;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(247,242,235,.95);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.mobilebar b{font-size:13px}.mobilebar button{border:1px solid var(--line);background:#fffaf4;border-radius:9px;padding:7px 9px;font-size:10px}.mobile-scenes{padding:10px 14px;border-bottom:1px solid var(--line);background:#f2eae2}.mobile-scenes.show{display:block}.mobile-scenes select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px}.main{padding:24px 18px 72px}.page-title{font-size:31px}.attempt{min-width:240px;max-width:240px}.expanded-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.main{padding:21px 14px 68px}.topbar{display:block}.scope{width:max-content;margin-top:15px}.page-title{font-size:28px}.subtitle{font-size:12px}.stats{grid-template-columns:1fr 1fr;margin:18px 0 25px;gap:8px}.stat{padding:12px}.stat b{font-size:17px}.section-head{align-items:flex-start}.section-head h2{font-size:20px}.attempt{min-width:220px;max-width:220px}.expanded-grid{grid-template-columns:1fr}.compare{padding:12px;border-radius:17px}.compare-top{align-items:flex-start}.compare-title{font-size:20px}.compare-actions{display:block}.compare-actions .ghost{white-space:nowrap}.compare-grid{grid-template-columns:1fr}.diff-grid{grid-template-columns:1fr}.setting-grid{grid-template-columns:1fr 1fr}.tabs{overflow:auto}.prompt{font-size:10px}.viewer-head{height:34px}.selection-summary{justify-content:flex-start;padding-left:4px}.legend{margin-bottom:4px}}

</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark">ㅅ</div><div><h1>사란 · 프롬프트 비교실</h1><small>GENERATION ARCHIVE</small></div></div>

  <main class="main">

<script>
const scenes=[
{id:'scene-01',title:'비 내리는 정류장',desc:'첫 만남의 거리감과 빗소리를 조정한 장면',period:'3일',runs:5,pv:3,ref:'character-sheet-01 · station-rain-ref'},
{id:'scene-02',title:'낮은 목소리의 대화',desc:'표정, 시선, 대화 간격의 미세한 차이를 비교한 장면',period:'3일',runs:4,pv:3,ref:'character-sheet-02 · dialogue-blocking-ref'},
{id:'scene-03',title:'밤의 골목',desc:'같은 장면의 생성 기록을 나란히 놓고 프롬프트 변화와 결과를 비교합니다.',period:'4일',runs:6,pv:4,ref:'character-sheet-02 · alley-lighting-ref'},
{id:'scene-04',title:'유리창 너머',desc:'반사광과 감정 표현의 강도를 조율한 장면',period:'4일',runs:5,pv:4,ref:'character-sheet-02 · reflection-window-ref'},
{id:'scene-05',title:'마지막 계단',desc:'엔딩 직전의 카메라 움직임과 멈춤 타이밍을 검증한 장면',period:'2일',runs:3,pv:2,ref:'character-sheet-02 · stair-ending-ref'}
];
const prompts=[
'A cinematic night alley. Saran stands under a dim amber street lamp, looking slightly away from camera. Soft rain, restrained acting, realistic skin texture, shallow depth of field. Camera slowly pushes in.',
'A cinematic night alley. Saran stands under a dim amber street lamp, looking directly past camera. Soft rain, restrained acting, realistic skin texture, shallow depth of field. Camera slowly pushes in. Keep background pedestrians minimal.',
'A cinematic night alley after rain. Saran pauses under one warm street lamp, shoulders tense but expression controlled. Wet pavement reflections, no crowd, practical lighting, natural breathing. Slow 50mm dolly-in, no handheld shake.',
'A quiet cinematic night alley after rain. Saran pauses under a single warm street lamp. Her shoulders are tense, expression controlled, eyes fixed just past the camera. Wet pavement catches broken reflections. No crowd. Natural breathing and micro-expressions. Slow 50mm dolly-in, locked horizon, no handheld shake.'
];
const palettes=[
'linear-gradient(135deg,#bda890,#725d50 46%,#352e2b)','linear-gradient(135deg,#be9e8b,#775349 49%,#292522)','linear-gradient(135deg,#a88977,#614941 45%,#23211f)','linear-gradient(135deg,#bea289,#6a4f43 46%,#262322)','linear-gradient(135deg,#b59882,#6f5547 48%,#2b2623)','linear-gradient(135deg,#c1a58f,#775947 48%,#2a2522)'];
const qs=new URLSearchParams(location.search);let current=qs.get('scene')||'scene-03';let scope=qs.get('scope')||'story';let pickA=1,pickB=4;let expanded=false;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const scene=()=>scenes.find(x=>x.id===current)||scenes[2];
function attemptsData(){const s=scene();return Array.from({length:s.runs},(_,i)=>({n:i+1,ver:Math.min(s.pv,1+Math.floor(i/1.5)),time:`09/${String(18+i).padStart(2,'0')} · ${String(9+i).padStart(2,'0')}:${String(18+i*4).padStart(2,'0')}`,dur:i%3===0?6:8,score:74+i*4,prompt:prompts[Math.min(prompts.length-1,Math.floor(i/1.5))],camera:i<2?'slow push-in':i<4?'50mm dolly-in':'locked 50mm dolly-in',seed:`SRN-${current.slice(-2)}-${String(i+1).padStart(2,'0')}`}))}
function setUrl(mode='replace'){const p=new URLSearchParams(location.search);p.set('view','history');p.set('scene',current);p.set('scope',scope);history[mode+'State']({},'',location.pathname+'?'+p.toString())}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1200)}
function renderScenes(){const q=($('#sceneSearch')?.value||'').trim().toLowerCase();const list=scenes.filter(s=>(s.title+' '+s.desc).toLowerCase().includes(q));$('#sceneList').innerHTML=list.map(s=>{const idx=scenes.indexOf(s)+1;return `<button class="scene-btn ${s.id===current?'active':''}" data-scene="${s.id}"><div class="scene-top"><span class="scene-no">SCENE ${String(idx).padStart(2,'0')}</span><span class="scene-count">${s.runs} RUNS</span></div><div class="scene-title">${s.title}</div><div class="scene-meta">${s.pv} prompt versions · ${s.period}</div></button>`}).join('')||'<div class="scene-meta" style="padding:10px">검색 결과가 없습니다.</div>';$$('.scene-btn').forEach(b=>b.onclick=()=>changeScene(b.dataset.scene));$('#sceneSelect').innerHTML=scenes.map((s,i)=>`<option value="${s.id}" ${s.id===current?'selected':''}>${String(i+1).padStart(2,'0')} · ${s.title}</option>`).join('')}
function attemptCard(x,i,compact=false){return `<article class="attempt ${i===pickA?'selA':''} ${i===pickB?'selB':''}" data-attempt="${i}" aria-label="생성본 ${x.n}"><div class="thumb" style="--scene-bg:${palettes[i%palettes.length]};--light-x:${60+i*3}%;--tilt:${(i-2.5)*.45}deg"><div class="figure"></div><button class="play" data-play-card="${i}" aria-label="생성본 ${x.n} 미리보기">▶</button><span class="thumb-label">TAKE ${String(x.n).padStart(2,'0')}</span><span class="thumb-duration">${x.dur}s</span></div><div class="attempt-row"><div class="attempt-title">생성본 ${x.n}</div><div class="attempt-time">${x.time}</div></div><div class="attempt-tags"><span class="tag">PROMPT v${x.ver}</span><span class="tag">match ${x.score}%</span><span class="tag">${x.camera}</span></div><div class="selects"><button class="pick ${i===pickA?'active':''}" data-pick="A" data-i="${i}">${i===pickA?'✓ A 선택됨':'A로 선택'}</button><button class="pick ${i===pickB?'active':''}" data-pick="B" data-i="${i}">${i===pickB?'✓ B 선택됨':'B로 선택'}</button></div></article>`}
function bindAttemptButtons(root=document){root.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(b.dataset.pick==='A')pickA=i;else pickB=i;if(pickA===pickB){const n=attemptsData().length;if(b.dataset.pick==='A')pickB=(i+1)%n;else pickA=(i-1+n)%n}render();$('#compareSection').scrollIntoView({behavior:'smooth',block:'start'})});root.querySelectorAll('[data-play-card]').forEach(b=>b.onclick=()=>toast(`생성본 ${+b.dataset.playCard+1} 미리보기`))}
function renderAttempts(){const a=attemptsData();$('#attemptStrip').innerHTML=a.map((x,i)=>attemptCard(x,i,true)).join('');$('#expandedGrid').innerHTML=a.map((x,i)=>attemptCard(x,i,false)).join('');$('#expandedGrid').classList.toggle('show',expanded);$('#attemptStrip').style.display=expanded?'none':'flex';$('#expandAll').textContent=expanded?'가로 보기로 돌아가기':'모든 시도 펼쳐보기';bindAttemptButtons($('#attemptStrip'));bindAttemptButtons($('#expandedGrid'));requestAnimationFrame(()=>{const selected=$(`#attemptStrip .attempt[data-attempt="${pickB}"]`);if(selected&&!expanded)selected.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})})}
function lcsDiff(a,b){const A=a.split(/(\s+)/),B=b.split(/(\s+)/);const m=A.length,n=B.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,outA=[],outB=[];while(i<m&&j<n){if(A[i]===B[j]){outA.push(`<span class="same">${esc(A[i])}</span>`);outB.push(`<span class="same">${esc(B[j])}</span>`);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){if(!/^\s+$/.test(A[i]))outA.push(`<span class="del">${esc(A[i])}</span>`);else outA.push(A[i]);i++}else{if(!/^\s+$/.test(B[j]))outB.push(`<span class="add">${esc(B[j])}</span>`);else outB.push(B[j]);j++}}while(i<m){outA.push(/^\s+$/.test(A[i])?A[i]:`<span class="del">${esc(A[i])}</span>`);i++}while(j<n){outB.push(/^\s+$/.test(B[j])?B[j]:`<span class="add">${esc(B[j])}</span>`);j++}return [outA.join(''),outB.join('')]}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateCompare(){const a=attemptsData();pickA=Math.max(0,Math.min(pickA,a.length-1));pickB=Math.max(0,Math.min(pickB,a.length-1));if(pickA===pickB)pickB=(pickA+1)%a.length;const A=a[pickA],B=a[pickB];$('#headA').textContent=`A · 생성본 ${A.n}`;$('#headB').textContent=`B · 생성본 ${B.n}`;$('#metaA').textContent=`v${A.ver} · ${A.dur}s · ${A.score}%`;$('#metaB').textContent=`v${B.ver} · ${B.dur}s · ${B.score}%`;$('#videoA').style.setProperty('--viewer-bg',palettes[pickA%palettes.length]);$('#videoB').style.setProperty('--viewer-bg',palettes[pickB%palettes.length]);const [da,db]=lcsDiff(A.prompt,B.prompt);$('#promptA').innerHTML=da;$('#promptB').innerHTML=db;$('#fullPrompt').textContent=`A · 생성본 ${A.n}\n${A.prompt}\n\nB · 생성본 ${B.n}\n${B.prompt}`;$('#selectionSummary').innerHTML=`<span>A = TAKE ${String(A.n).padStart(2,'0')}</span><span>B = TAKE ${String(B.n).padStart(2,'0')}</span>`;$('#settingGrid').innerHTML=[['MODEL','Video Gen v4'],['ASPECT','16:9'],['DURATION',`${A.dur}s / ${B.dur}s`],['CAMERA',`${A.camera} / ${B.camera}`],['REFERENCE',scene().ref],['SEED',`${A.seed} / ${B.seed}`]].map(([k,v])=>`<dl class="setting"><dt>${k}</dt><dd>${esc(v)}</dd></dl>`).join('');$('#referenceText').textContent=`${scene().ref}를 공통 참조로 두고, 프롬프트와 카메라 조건만 단계적으로 바꿔 결과 차이를 확인하는 비교 기록입니다.`}
function render(){const s=scene();$('#sceneNum').textContent=current.slice(-2);$('#sceneDescription').textContent=s.desc;$('#sceneHeading').textContent=`장면 ${current.slice(-2)} · ${s.title}`;$('#statPeriod').textContent=s.period;$('#statRuns').textContent=s.runs;$('#statPrompts').textContent=s.pv;$$('.scope button').forEach(b=>b.classList.toggle('active',b.dataset.scope===scope));renderScenes();renderAttempts();updateCompare()}
function changeScene(id){current=id;pickA=0;pickB=Math.min(2,scene().runs-1);setUrl('push');render()}
function playViewer(which){const el=$(`#viewer${which}`);el.classList.remove('playing');void el.offsetWidth;el.classList.add('playing');setTimeout(()=>el.classList.remove('playing'),2450)}
$('#sceneSearch').addEventListener('input',renderScenes);$('#expandAll').onclick=()=>{expanded=!expanded;renderAttempts()};$('#mobileMenu').onclick=()=>{const open=$('#mobileScenes').classList.toggle('show');$('#mobileMenu').setAttribute('aria-expanded',String(open))};$('#sceneSelect').onchange=e=>{changeScene(e.target.value);$('#mobileScenes').classList.remove('show');$('#mobileMenu').setAttribute('aria-expanded','false')};
$$('.scope button').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;setUrl('replace');render();toast(scope==='story'?'스토리 범위':'전체 범위')});
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-selected','false')});t.classList.add('active');t.setAttribute('aria-selected','true');const diff=t.dataset.tab==='diff';$('#diffPanel').style.display=diff?'block':'none';$('#settingsPanel').classList.toggle('active',!diff)});
$('#toggleFull').onclick=()=>{const on=$('#fullPrompt').classList.toggle('show');$('#toggleFull').textContent=on?'원문 닫기':'원문 전체 보기'};
$$('.copy').forEach(b=>b.onclick=async()=>{const A=attemptsData()[b.dataset.copy==='A'?pickA:pickB].prompt;try{await navigator.clipboard.writeText(A)}catch(e){const ta=document.createElement('textarea');ta.value=A;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast(`${b.dataset.copy} 프롬프트 복사됨`)});
$('#nextPair').onclick=()=>{const n=attemptsData().length;pickA=(pickA+1)%n;pickB=(pickB+1)%n;if(pickA===pickB)pickB=(pickB+1)%n;renderAttempts();updateCompare()};$('#prevPair').onclick=()=>{const n=attemptsData().length;pickA=(pickA-1+n)%n;pickB=(pickB-1+n)%n;if(pickA===pickB)pickA=(pickA-1+n)%n;renderAttempts();updateCompare()};
$('#playBoth').onclick=()=>{playViewer('A');playViewer('B');toast('A · B 동시 재생')};$$('.viewer-play').forEach(b=>b.onclick=()=>playViewer(b.dataset.viewer));
window.onpopstate=()=>{const p=new URLSearchParams(location.search);current=p.get('scene')||'scene-03';scope=p.get('scope')||'story';pickA=0;pickB=Math.min(2,scene().runs-1);render()};
render();
</script>
</body></html>
